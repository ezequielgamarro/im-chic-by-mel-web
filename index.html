  <!-- Global responsive typography & layout protection -->
  <style>
    html {
      font-size: 100%;
      overflow-x: hidden;
      width: 100%;
      -webkit-text-size-adjust: 100%;
    }
    @media (min-width: 640px) {
      html { font-size: 106%; }
    }
    @media (min-width: 1024px) {
      html { font-size: 112%; }
    }
    body {
      overflow-x: hidden;
      width: 100%;
      position: relative;
    }
    img, video, canvas, svg {
      max-width: 100%;
      height: auto;
    }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
